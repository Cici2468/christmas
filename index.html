<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note</title>
</head>

<style>

    body{
        text-align: center;
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTjrD4CboHUNmuhOR8dcujL1_EVkZPyU7FnTdOFiBT4Iw&s=10");
    }

    .picture{
        width: 300px;
        height: 300px;
    }

    .picture:hover{
        transform: scale(1.2);
        rotate: 4deg;
    }

    .audio{
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 300px;
        height: 45px;
        border-radius: 50px;
        box-shadow: 0 8px 20px rgb(1, 1, 133);
        outline: none;
        z-index: 1000;
        transition: transform 0.2 ease, box-shadow 0.2 ease;
    }

    .audio:hover{
        box-shadow: 0 12px 25px rgb(1, 1, 133) ;
    }

    .audio::-webkit{
        background: linear-gradient(135deg,#2b2b42,#1a1b26);
        transform: translateY(-3px);
    }

</style>

<body>
    
<h1>Mery Christmas 🌟</h1>
<p>Let's hope that next year is the best year ever :D ! </p> 
<p>Happy Holidays !</p> 
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAmWuep62O5wpbaeGw5zG9uY82xZmBNJgE5gPPBclUwxtIPhXWIs91-Ro&s=10" class="picture">
<audio controls autoplay loop>
    <source src="Carol Of The Bells  Christmas Music  Instrumental Version - ikoliks.mp3" type="audio/mpeg">
</audio>

</body>
</html>
